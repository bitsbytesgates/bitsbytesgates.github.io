<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 808 410" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- framed panel + soft shadow (auto) -->
  <rect x="-1.4" y="2.5" width="762.8" height="352.8" rx="13.4" fill="#0f172a" opacity="0.030"/>
  <rect x="-2.8" y="2.0" width="765.6" height="355.6" rx="14.8" fill="#0f172a" opacity="0.030"/>
  <rect x="-4.2" y="1.5" width="768.4" height="358.4" rx="16.2" fill="#0f172a" opacity="0.030"/>
  <rect x="-5.6" y="1.0" width="771.2" height="361.2" rx="17.6" fill="#0f172a" opacity="0.030"/>
  <rect x="-7.0" y="0.5" width="774.0" height="364.0" rx="19.0" fill="#0f172a" opacity="0.030"/>
  <rect x="-8.4" y="0.0" width="776.8" height="366.8" rx="20.4" fill="#0f172a" opacity="0.030"/>
  <rect x="-9.8" y="-0.5" width="779.6" height="369.6" rx="21.8" fill="#0f172a" opacity="0.030"/>
  <rect x="-11.2" y="-1.0" width="782.4" height="372.4" rx="23.2" fill="#0f172a" opacity="0.030"/>
  <rect x="0" y="0" width="760" height="350" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>


  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">How IVPM finds a dependency's skills</text>
  <text x="380" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">four mechanisms, tried in priority order</text>

  <!-- priority arrow on the left -->
  <line x1="36" y1="78" x2="36" y2="318" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr3)"/>
  <text x="22" y="200" font-size="11" fill="#94a3b8" transform="rotate(-90 22 200)" text-anchor="middle">priority</text>

  <!-- tier 1 -->
  <rect x="60" y="74" width="660" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="92" cy="100" r="15" fill="#3b82f6"/><text x="92" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="122" y="96" font-size="13.5" font-weight="600" fill="#1e3a8a">Consumer-specified path</text>
  <text x="122" y="115" font-size="11.5" fill="#475569">glob in your ivpm.yaml dep entry, e.g. <tspan font-family="monospace" fill="#1e3a8a">skills/**/SKILL.md</tspan></text>

  <!-- tier 2 -->
  <rect x="60" y="134" width="660" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="92" cy="160" r="15" fill="#3b82f6"/><text x="92" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="122" y="156" font-size="13.5" font-weight="600" fill="#1e3a8a">Package-declared path</text>
  <text x="122" y="175" font-size="11.5" fill="#475569">the dependency advertises its own skills via <tspan font-family="monospace" fill="#1e3a8a">with.agents.skills</tspan></text>

  <!-- tier 3 -->
  <rect x="60" y="194" width="660" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="92" cy="220" r="15" fill="#3b82f6"/><text x="92" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <text x="122" y="216" font-size="13.5" font-weight="600" fill="#1e3a8a">Auto-probe</text>
  <text x="122" y="235" font-size="11.5" fill="#475569">root <tspan font-family="monospace" fill="#1e3a8a">SKILL.md</tspan> + recursive <tspan font-family="monospace" fill="#1e3a8a">skills/</tspan> search — most packages need no config</text>

  <!-- tier 4 -->
  <rect x="60" y="254" width="660" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <circle cx="92" cy="285" r="15" fill="#8b5cf6"/><text x="92" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
  <text x="122" y="279" font-size="13.5" font-weight="600" fill="#5b21b6">Python entry points</text>
  <text x="122" y="297" font-size="11.5" fill="#475569">query the <tspan font-family="monospace" fill="#5b21b6">agent.skills</tspan> group on installed packages</text>
  <text x="122" y="312" font-size="10.5" fill="#7c3aed" font-style="italic">(legacy ivpm.skill group still accepted)</text>
</svg>
