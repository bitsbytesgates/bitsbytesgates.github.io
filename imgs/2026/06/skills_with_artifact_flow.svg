<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 908 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- framed panel + soft shadow (auto) -->
  <rect x="-1.4" y="2.5" width="862.8" height="362.8" rx="13.4" fill="#0f172a" opacity="0.030"/>
  <rect x="-2.8" y="2.0" width="865.6" height="365.6" rx="14.8" fill="#0f172a" opacity="0.030"/>
  <rect x="-4.2" y="1.5" width="868.4" height="368.4" rx="16.2" fill="#0f172a" opacity="0.030"/>
  <rect x="-5.6" y="1.0" width="871.2" height="371.2" rx="17.6" fill="#0f172a" opacity="0.030"/>
  <rect x="-7.0" y="0.5" width="874.0" height="374.0" rx="19.0" fill="#0f172a" opacity="0.030"/>
  <rect x="-8.4" y="0.0" width="876.8" height="376.8" rx="20.4" fill="#0f172a" opacity="0.030"/>
  <rect x="-9.8" y="-0.5" width="879.6" height="379.6" rx="21.8" fill="#0f172a" opacity="0.030"/>
  <rect x="-11.2" y="-1.0" width="882.4" height="382.4" rx="23.2" fill="#0f172a" opacity="0.030"/>
  <rect x="0" y="0" width="860" height="360" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>


  <text x="430" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">One &#8220;ivpm update&#8221; delivers binaries and their skills</text>

  <!-- ===== column 1: dependencies ===== -->
  <text x="135" y="66" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b">Dependencies (each bundles skills/)</text>
  <g>
    <rect x="40" y="80" width="190" height="58" rx="8" fill="#bae6fd" stroke="#0369a1" stroke-width="1.8"/>
    <text x="135" y="103" text-anchor="middle" font-size="12.5" font-weight="600" fill="#075985">yosys-bin</text>
    <text x="135" y="122" text-anchor="middle" font-size="10.5" fill="#0369a1">skills/ → yosys · sby · sv2v</text>
  </g>
  <g>
    <rect x="40" y="148" width="190" height="50" rx="8" fill="#bae6fd" stroke="#0369a1" stroke-width="1.8"/>
    <text x="135" y="168" text-anchor="middle" font-size="12.5" font-weight="600" fill="#075985">verilator</text>
    <text x="135" y="186" text-anchor="middle" font-size="10.5" fill="#0369a1">skills/ → verilator</text>
  </g>
  <g>
    <rect x="40" y="208" width="190" height="50" rx="8" fill="#bae6fd" stroke="#0369a1" stroke-width="1.8"/>
    <text x="135" y="228" text-anchor="middle" font-size="12.5" font-weight="600" fill="#075985">nextpnr-bin</text>
    <text x="135" y="246" text-anchor="middle" font-size="10.5" fill="#0369a1">skills/ → nextpnr</text>
  </g>

  <!-- arrows to IVPM -->
  <line x1="230" y1="109" x2="332" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="230" y1="173" x2="332" y2="173" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="230" y1="233" x2="332" y2="186" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- ===== IVPM ===== -->
  <rect x="335" y="120" width="150" height="106" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2.2"/>
  <text x="410" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">IVPM</text>
  <text x="410" y="178" text-anchor="middle" font-size="10.5" fill="#475569">discover skills,</text>
  <text x="410" y="193" text-anchor="middle" font-size="10.5" fill="#475569">link into project,</text>
  <text x="410" y="208" text-anchor="middle" font-size="10.5" fill="#475569">clean stale entries</text>

  <line x1="485" y1="148" x2="582" y2="120" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="485" y1="198" x2="582" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- ===== output dirs ===== -->
  <text x="700" y="66" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b">Project-local config (relative symlinks)</text>

  <rect x="585" y="78" width="230" height="96" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.9"/>
  <text x="700" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">.agents/skills/</text>
  <text x="600" y="116" font-size="10" fill="#047857" font-family="monospace">yosys-bin-yosys → …/skills/yosys</text>
  <text x="600" y="131" font-size="10" fill="#047857" font-family="monospace">yosys-bin-sby   → …/skills/sby</text>
  <text x="600" y="146" font-size="10" fill="#047857" font-family="monospace">verilator-…     → …/skills/verilator</text>
  <text x="600" y="161" font-size="10" fill="#047857" font-family="monospace">nextpnr-bin-…   → …/skills/nextpnr</text>
  <text x="700" y="170" text-anchor="middle" font-size="9.5" fill="#16a34a" font-style="italic">(toolchain-neutral · any agent)</text>

  <rect x="585" y="184" width="230" height="62" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.9"/>
  <text x="700" y="204" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">.claude/skills/</text>
  <text x="700" y="222" text-anchor="middle" font-size="10.5" fill="#4338ca">same links, mirrored when</text>
  <text x="700" y="237" text-anchor="middle" font-size="10.5" fill="#4338ca">agents.claude: true</text>

  <!-- footer -->
  <rect x="200" y="288" width="460" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="430" y="308" text-anchor="middle" font-size="11.5" fill="#92400e">The agent now knows the synth_ecp5 flow because the skill</text>
  <text x="430" y="325" text-anchor="middle" font-size="11.5" fill="#92400e">shipped with the binary — no global install, nothing curated.</text>
</svg>
