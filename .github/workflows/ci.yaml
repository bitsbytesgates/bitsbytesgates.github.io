# Build and publish bitsbytesgates.com from GitHub Actions.
#
# WHAT CHANGED, AND WHY IT MATTERS
# --------------------------------
# This workflow used to deploy on every push to main. It no longer does. A push
# builds the site and stops; publishing happens only when you push a `v*` tag.
#
# Two reasons, both learned elsewhere in the estate:
#
#  1. Committing and publishing are different decisions. Fixing a typo in a
#     draft, pushing a work-in-progress, or merging a branch should not put
#     anything in front of readers. The tag is the moment you chose.
#  2. The release-authority switch needs a single deliberate moment to refuse.
#     A guard that fires on every push is noise; a guard that fires on a tag is
#     a decision point.
#
# To publish:  git tag v2026.08.23 && git push origin v2026.08.23
#              (origin is Forgejo; the tag mirrors to GitHub, which runs this.)
#
# WHERE THIS RUNS
# ---------------
# Forgejo is the origin of truth for this repo; GitHub is a downstream mirror
# that happens to hold the publishing credential for GitHub Pages. The Forgejo
# side has its own copy of this pipeline in .forgejo/workflows/publish.yml, and
# the switch below decides which one is allowed to publish. Exactly one can.

name: Build and Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      override:
        description: 'Publish even if the authority switch says otherwise (say why in the run notes)'
        type: boolean
        default: false

jobs:
  build:
    # Runs on every trigger, including pull requests. A build that only happens
    # at release time tells you the site is broken at the worst possible moment.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        # Pinned via .nvmrc, which is the version this site is developed and
        # verified against. The Ruby toolchain it replaced was unpinned, and a
        # silent Ruby bump was exactly the class of breakage that made a release
        # feel unrepeatable. One file holds the version; nothing else names it.
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # `ci`, not `install`: the lockfile is authoritative and a build must not
        # be allowed to quietly resolve a different dependency tree than the one
        # the site was verified against.
        run: npm ci

      - name: Build site
        # `npm run build` is the whole pipeline, and it is the SAME command used
        # locally -- prebuild regenerates public/_redirects from src/url-map.json,
        # astro builds, post-build-images normalises <img>, pagefind indexes.
        # Keeping CI and local on one command is what stops the two diverging.
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Sanity-check the build
        # A static-site build can exit 0 having produced almost nothing -- an
        # empty content collection or a bad glob leaves a shell of a site. These
        # checks are what distinguish "built" from "built something real", and
        # they run before anything is allowed to reach readers.
        #
        # 183 pages at the Astro cutover (81 posts + topic/series/archive/
        # pagination pages), against ~105 for Jekyll: the floor is re-baselined
        # accordingly. It is a floor, not an assertion of the exact count --
        # writing a post legitimately moves the number up.
        run: |
          test -s dist/index.html || { echo "::error::no index.html in the build output"; exit 1; }
          n=$(find dist -name '*.html' | wc -l)
          echo "generated pages: $n"
          [ "$n" -ge 150 ] || { echo "::error::only $n pages built; expected ~183. Refusing to call this a site."; exit 1; }
          # The redirect map is what keeps nine years of inbound links alive. It
          # is generated, so an empty or missing one is a silent build failure.
          test -s dist/_redirects || { echo "::error::no _redirects in the build output"; exit 1; }
          r=$(grep -c '  301$' dist/_redirects)
          echo "redirect rules: $r"
          [ "$r" -ge 160 ] || { echo "::error::only $r redirect rules; expected ~167. Old URLs would 404."; exit 1; }
          # Pagefind runs last and fails soft if the site tree surprises it.
          test -s dist/pagefind/pagefind.js || { echo "::error::pagefind did not index the site"; exit 1; }

      - name: Upload site
        # The published tree is an artifact, so the deploy job ships exactly the
        # bytes that were built and checked -- not a rebuild that might differ.
        uses: actions/upload-artifact@v4
        with:
          name: bbg-site
          # include-hidden-files keeps dist/.nojekyll in the artifact; without it
          # GitHub Pages strips dist/_astro/, which is every stylesheet and script
          # on the site.
          path: dist/**
          include-hidden-files: true
          if-no-files-found: error

  gate:
    # Release authority -- the transfer switch.
    #
    # ONE file, above both platforms, decides who publishes:
    #   https://dvkit.org/.well-known/release-authority.json
    # generated from sync-policy.toml by `git-sync emit-release-authority`, so
    # GitHub and Forgejo cannot drift: there is only one copy to disagree about.
    #
    # The runner only READS it, unauthenticated. A workflow file is public and
    # editable by anyone who can push, so nothing secret goes in one.
    #
    # `if:` on a job cannot reference a step in its own job, hence the output.
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The resolver is one line on purpose: a multi-line `python3 -c` has to
        # start at column 0, which terminates the YAML block scalar and silently
        # corrupts the workflow.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # Fail CLOSED, but only make noise when a release was actually due.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable on a non-tag ref; nothing to release"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  publish:
    # Tags only, and only when the switch names GitHub as this repo's publisher.
    #
    # When the switch says "forgejo" this job SKIPS -- it does not fail. A red
    # build on the dormant side every time anyone tags would train people to
    # ignore the signal, which is worse than having no signal.
    if: >-
      needs.gate.outputs.authority == 'github' &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.override)
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Announce an override
        if: inputs.override
        run: echo "::warning::publishing via manual override on ${{ github.ref }} -- the tag gate was bypassed"

      - name: Checkout
        # Required even though nothing here builds: the Pages deploy action runs
        # git commands against the workspace and dies with "fatal: not in a git
        # directory" without a checkout. The site itself still comes from the
        # artifact below -- this checkout is scaffolding for the action, not a
        # second source of content.
        uses: actions/checkout@v4

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: bbg-site
          path: dist

      - name: Deploy to GitHub Pages
        # DORMANT as of the 2026-08-23 DNS cutover: bitsbytesgates.com is served
        # by Cloudflare Pages, so nothing reads gh-pages any more. The step stays
        # only until the 48 h watch on the GitHub teardown expires (earliest
        # 2026-08-25 ~15:30 UTC), at which point it and the branch's custom
        # domain go away together. Removing it here would front-run that watch.
        #
        # Note the branch stops being a Jekyll rollback target the first time
        # this runs: it will hold the Astro tree. That is acceptable because the
        # real rollback is promoting the previous Cloudflare Pages deployment,
        # and the Jekyll source survives on the `jekyll-archive` branch.
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist

      - name: Deploy to Cloudflare Pages
        # THE live leg since the 2026-08-23 DNS cutover -- this is what readers
        # get. The gh-pages step above is the vestigial one now, not this.
        #
        # Skipped, loudly, when the secret is absent. That tolerance predates the
        # cutover, when gh-pages was primary; it now means a release can report
        # success having published nothing, so it is on the list to tighten into
        # a hard failure once the gh-pages leg is removed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BBG_PAGES_PAT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_BBG_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_BBG_PAGES_PAT is not set; skipping the Cloudflare Pages leg"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist \
            --project-name=bitsbytesgates \
            --branch=main \
            --commit-dirty=true
