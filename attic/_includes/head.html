<head>
  <link href="http://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <title>
    {{ author }}
    {% if page.title == "Home" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  {% if page.url and site.baseurl %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% endif %}

  <link rel="stylesheet" href="{{ 'public/css/poole.css' | absolute_url }}">
  <link rel="stylesheet" href="{{ 'public/css/syntax.css' | absolute_url }}">
  <link rel="stylesheet" href="{{ 'public/css/lanyon.css' | absolute_url }}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=PT+Serif:400,400italic,700%7CPT+Sans:400">

  <link rel="icon" href="{{ '/public/favicon.ico' | absolute_url }}" sizes="32x32">
  <link rel="icon" href="{{ '/public/favicon.svg' | absolute_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/public/apple-touch-icon.png' | absolute_url }}">
  <link rel="manifest" href="{{ '/public/site.webmanifest' | absolute_url }}">
  <meta name="theme-color" content="#1c2128">

  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ '/feed.xml' | absolute_url }}">

  {% if page.mermaid %}
      {% include mermaid.html %}
  {% endif %}
  <!--
  <script type="module">
    import mermaid from "{{ 'public/js/mermaid.esm.min.mjs' | absolute_url }}";
  </script>
    -->
<!-- Google tag (gtag.js) -->

<!--
Pre-env
{{ jekyll.environment }}
Post-env
-->

{% if jekyll.environment == "development" %}
{% else %}
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HHGYPST0ZT"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-HHGYPST0ZT');
</script>
{% endif %}

</head>
