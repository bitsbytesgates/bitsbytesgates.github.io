# frozen_string_literal: true
#
# NOT ON THE BUILD PATH. The site builds with Astro (`npm run build`); nothing in
# CI runs bundler any more.
#
# Kept so the Jekyll tree still in this repo can be built by hand while it is
# being wound down -- diffing old output against new is the cheapest way to
# settle "did the migration change this page?".
#
# The `gemspec :path => "packages/rouge"` line is gone: that was the PSS
# highlighting bridge, fetched by IVPM from mballance/rouge@pss. Shiki replaced
# it, reading grammars/pss.tmLanguage.json straight from this repo, so
# packages/rouge is never populated and the gemspec would fail to resolve.
# Highlighting here therefore falls back to stock Rouge, which does not know PSS
# -- expected, and not worth maintaining a fork for.

source 'http://rubygems.org'

gem 'jekyll'
gem 'jekyll-feed'
gem 'jekyll-theme-tactile'
gem 'jekyll-paginate'
gem 'jekyll-mermaid'
